[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinemata"
version = "0.1.0"
description = "A reproducible, provider-neutral pipeline for episodic media production"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Cinemata contributors" }]
dependencies = []

[project.scripts]
cinemata = "cinemata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
